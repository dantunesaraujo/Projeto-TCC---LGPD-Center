<!DOCTYPE html>
<html>

<head>
<meta name="" content="width=device-width, initial-scale=1.0">
<meta charset="UTF-8">
<title>LGPD Center</title>
<link rel="stylesheet" href="/estetica/style.css">
</head>

<body class="login-body">

<div class="login-card">

    <img
        src="/logos/logo1.jpeg"
        class="login-logo"
        alt="Logo LGPD"
    >


    <h1>
        LGPD Center
    </h1>


    <p>
        sistema de avaliação de atendimento à LGPD
    </p>


    <input
        id="email"
        type="email"
        placeholder="Email"
    >


    <input
        id="senha"
        type="password"
        placeholder="Senha"
    >


    <button onclick="login()">
        Entrar no Sistema
    </button>


    <p id="erro"></p>


    <p class="info">
        acesso utilizado para avaliação do sistema
    </p>

</div>


<script src="/estetica/script.js"></script>

</body>
</html>
